name: checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the parser
        run: python -m py_compile lnm_aor.py
      - name: AOR config and published data parse as JSON
        run: for f in aors.json data/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
